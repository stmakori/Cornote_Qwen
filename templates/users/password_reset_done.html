{% extends 'base.html' %}
{% block title %}Check Your Email | Cornote{% endblock %}

{% block content %}
<div class="auth-page d-flex align-items-center justify-content-center min-vh-100 px-3 py-4">
  <div class="auth-card text-center">
    <i class="bi bi-envelope-check display-4 text-success mb-3 auth-brand-icon" aria-hidden="true"></i>
    <h1 class="h4 fw-bold">Check your email</h1>
    <p class="text-muted small">
      If an account exists with that email, we've sent a link to reset your password.
      It may take a minute to arrive.
    </p>
    <a href="{% url 'users:login' %}" class="btn btn-ghost btn-sm mt-3">
      <i class="bi bi-arrow-left me-1"></i>Back to sign in
    </a>
  </div>
</div>
{% endblock %}
