{% extends 'base.html' %}
{% block title %}Password Reset | Cornote{% endblock %}

{% block content %}
<div class="auth-page d-flex align-items-center justify-content-center min-vh-100 px-3 py-4">
  <div class="auth-card text-center">
    <i class="bi bi-check-circle-fill display-4 text-success mb-3 auth-brand-icon" aria-hidden="true"></i>
    <h1 class="h4 fw-bold">Password updated</h1>
    <p class="text-muted small">Your password has been changed. You can sign in now.</p>
    <a href="{% url 'users:login' %}" class="btn btn-accent w-100 mt-3">
      <i class="bi bi-door-open me-2"></i>Sign In
    </a>
  </div>
</div>
{% endblock %}
