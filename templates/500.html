<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Something went wrong | Cornote</title>
  <!--
    Deliberately standalone with everything inlined (no base.html, no CDN
    links, no Django url-tag lookups) - a 500 can be triggered by a broken
    middleware, URL resolver, or template chain, so this page must not
    depend on any of the app machinery that might be what's currently
    failing.
  -->
  <style>
    :root {
      --bg-base: #0f172a;
      --bg-surface: #1e293b;
      --bg-border: #475569;
      --text-primary: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #f59e0b;
      --accent-hover: #d97706;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 1.5rem;
    }
    .card {
      max-width: 28rem;
      background: var(--bg-surface);
      border: 1px solid var(--bg-border);
      border-radius: 0.75rem;
      padding: 2.5rem 2rem;
    }
    .icon { font-size: 2.75rem; line-height: 1; margin-bottom: 0.5rem; }
    h1 { font-size: 1.4rem; margin: 0.5rem 0; }
    p { color: var(--text-muted); margin: 0 0 1.5rem; }
    a.btn {
      display: inline-block;
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
      text-decoration: none;
      padding: 0.6rem 1.4rem;
      border-radius: 0.5rem;
    }
    a.btn:hover { background: var(--accent-hover); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">&#9888;&#65039;</div>
    <h1>Something went wrong</h1>
    <p>An unexpected error occurred on our end. It's been logged - please try again in a moment.</p>
    <a class="btn" href="/">Back to Cornote</a>
  </div>
</body>
</html>
